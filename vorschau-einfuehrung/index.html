<style>
.intro-page .topbar .intro-title { flex: 0 0 100%; padding: 0; margin: 0; }

.adventure-link{flex-basis:100%;min-width:0}
.adventure-link p,.adventure-next{font-size:calc(22px * var(--text));font-weight:bold;line-height:1.5;margin:12px 0;text-align:center}

<body class="intro-page">
<header class="topbar"><a class="brand" href="#main"><span class="brandmark" aria-hidden="true">✧</span><span>Silvana<span class="brand-sub">Geschichten zum Lesen und Vorlesen</span></span></a>
<figure class="intro-title" id="introTitle"><img class="landscape" src="assets/silvana-karte.png" width="1536" height="1024" alt="Silvana: zwei Dörfer, eine Stadt und eine Burg zwischen Bergen und einem Wald mit glitzernden Spinnweben."><figcaption>Ein kleines Land voller Geschichten.</figcaption></figure>
<button class="quiet" id="settingsToggle" aria-expanded="false" aria-controls="settings">Aa · Größe ändern</button></header>
<section id="settings" class="settings" aria-label="Größe einstellen" hidden>
<label for="textSize">Schrift <output id="textOutput" for="textSize">100 %</output><input id="textSize" type="range" min="90" max="160" step="10" value="100"></label>
<label for="boardSize">Spielfeld <output id="boardOutput" for="boardSize">100 %</output><input id="boardSize" type="range" min="80" max="160" step="10" value="100"></label>
<p>Stelle Schrift und Spielfeld unabhängig voneinander ein.</p>
</section>
<main class="parchment-actions" id="main" tabindex="-1">
<details class="scene-menu" id="sceneMenu" data-scene="1"><summary>Andere Szene noch einmal spielen</summary><nav aria-label="Abgeschlossene Szenen"><p class="note">Hier erscheinen abgeschlossene Szenen.</p></nav></details>
<div id="game"></div>
<noscript>Bitte aktiviere JavaScript, um das Domino zu spielen.</noscript>
<footer><span>In deinem Tempo. Ohne Zeitdruck.</span><span class="footerleaf" aria-hidden="true">✧</span><span>Das Land der glitzernden Spinnweben</span></footer>
</main>
<template id="landscape"><img class="landscape" src="assets/silvana-karte.png" width="1536" height="1024" alt="Silvana: zwei Dörfer, eine Stadt und eine Burg zwischen Bergen und einem Wald mit glitzernden Spinnweben."></template>
