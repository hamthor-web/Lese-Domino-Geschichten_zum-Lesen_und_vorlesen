<!doctype html>
<html lang="de" data-app="eiche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e9dc">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/silvana-icon-192.png">
  <script src="spielstand.js" defer></script>
  <script src="start.js" defer></script>
  <script src="../shared/geschichte-reset.js" defer></script>
  <title>Die Eiche</title>
  <style>
    @font-face { font-family: Andika; src: url('../vorschau-einfuehrung/assets/fonts/Andika-Regular.ttf'); font-weight: 400; font-display: swap; }
    @font-face { font-family: Andika; src: url('../vorschau-einfuehrung/assets/fonts/Andika-Bold.ttf'); font-weight: 700; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2e9dc; color: #291709; font-family: Andika, sans-serif; }
    .welcome {
      display: grid;
      justify-items: center;
      gap: clamp(.5rem, 2vw, 1.1rem);
      width: min(100%, 40rem);
      margin-inline: auto;
      padding: clamp(2rem, 8vw, 4rem) 17% clamp(2.25rem, 8vw, 4rem);
      background: url('../assets/willkommen-pergament.webp') center / 100% 100%;
    }
    @media (min-width: 40rem) {
      .welcome { padding-inline: 6.5rem; }
    }
    .mascot { display: block; }
    .mascot img {
      display: block;
      width: clamp(8rem, 40vw, 14rem);
      max-width: 100%;
      height: auto;
    }
    .greeting {
      color: #f1e9d5;
      font-weight: 700;
      text-align: center;
      -webkit-text-stroke: .45px #382213;
      text-shadow: 0 1px 2px #382213, 0 0 4px #382213, 0 0 8px #382213;
    }
    .greeting p { margin: .3em 0; font-size: clamp(1.04rem, 4vw, 1.55rem); line-height: 1.3; }
    h1 {
      margin: .05em 0 .1em;
      color: inherit;
      font-size: clamp(2.5rem, 9vw, 4.7rem);
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: inherit;
      line-height: 1.05;
    }
    .note {
      margin: .4rem auto 0;
      max-width: 32rem;
      padding: 0 1rem 1.25rem;
      text-align: center;
      font-size: .77rem;
      line-height: 1.42;
      text-shadow: 0 1px 4px #f7e0c0;
    }
    #sprachfassung { font-size: 1rem; }
    footer section { width: min(90%, 32rem); margin: 0 auto 1rem; text-align: center; }
    footer audio { width: 100%; }
    .note-heading { font-weight: 700; padding-bottom: 0; }
    .aktionen { display: grid; grid-template-columns: minmax(0, 1fr); gap: .55rem; width: 100%; min-width: 0; }
    .start {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      aspect-ratio: 1443 / 540;
      min-height: 48px;
      padding: .45em 10% 0;
      overflow-wrap: anywhere;
      background: transparent url('../assets/die-eiche/abschnitt-2/knetrahmen.webp') center / contain no-repeat;
      border: 0;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      color: inherit;
      font-size: clamp(.95rem, 3.7vw, 1.23rem);
      font-weight: bold;
      line-height: 1.22;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
    }
    .hilfe, #app-status { margin: 0; font-size: .95rem; line-height: 1.4; }
    .hilfe { padding: .65rem; border-radius: .5rem; background: #f8e7cc; }
    .hilfe p { margin: .3em 0; }
    #app-status:empty { display: none; }
    .start:hover { filter: brightness(1.07); }
    .start:focus-visible { outline: 3px solid #582b13; outline-offset: 3px; border-radius: 2rem; }
    @media (min-width: 48rem) and (orientation: landscape) {
      .welcome {
        width: min(100%, 59rem);
        grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
        align-items: center;
        padding: 3.5rem min(16vw, 9.5rem);
      }
      .mascot { grid-row: span 2; }
      .aktionen { grid-column: 2; }
    }
  </style>
  <link rel="stylesheet" href="../shared/app-info.css">
  <script src="../shared/app-info.js?v=2" defer></script>

  <link rel="stylesheet" href="../shared/game-selection.css">
</head>
<body>
  <main class="welcome">
    <picture class="mascot">
      <source media="(prefers-reduced-motion: reduce)" srcset="../assets/willkommen-wuerstchen.webp">
      <img src="../assets/willkommen-wuerstchen-animiert.webp" alt="Das Kleine Würstchen mit Krone verbeugt sich zur Begrüßung." width="301" height="336">
    </picture>
    <div class="greeting">
      <p>Hallo, schön, dass du da bist.</p>
      <p>Lass uns gemeinsam die Geschichte</p>
      <h1>Die Eiche</h1>
      <p>entdecken.</p>
    </div>
    <div class="aktionen">
      <a class="start" id="eiche-start" href="./abschnitt-1/">Lass uns das Spiel mit der Geschichte beginnen!</a>
      <button class="start" id="zuruecksetzen" type="button">Spiel zurücksetzen</button>
      <p id="app-status" role="status"></p>
    </div>
  </main>
  <footer>
  <section aria-labelledby="sprachfassung">
      <h2 id="sprachfassung">Geschichte anhören</h2>
      <audio controls preload="metadata" aria-labelledby="sprachfassung" src="../assets/die-eiche/die-eiche-sprachfassung.mp3"></audio>
    </section>
  </footer>

  <a class="game-selection-link" href="../">Zur Spielauswahl</a>
</body>
</html>
