<script src="../spielstand.js?v=3"></script><script src="../page-turn.js"></script><script>
const $=id=>document.getElementById(id), screen=$('screen'), media={image:'../../assets/die-eiche/abschnitt-3/winterbild.webp',skate:'../../assets/die-eiche/abschnitt-3/schlittschuh.mp4',birds:'../../assets/die-eiche/abschnitt-3/voegel.mp4',turn:'../../assets/die-eiche/abschnitt-1/blaettern.mp3',book:'../../assets/die-eiche/abschnitt-2/buchoeffnen.mp4',still:'../../assets/die-eiche/abschnitt-2/buch-standbild.jpg',swirl:'../../assets/die-eiche/abschnitt-2/kringel.png',jump:'../../assets/die-eiche/abschnitt-2/weiter-huepfen.webm',jumpStill:'../../assets/die-eiche/abschnitt-2/weiter-standbild.png',audio:'../../assets/die-eiche/abschnitt-3/vorleseton.mp3'};

 {name:'Kinder', target:0},
 {name:'Krähen', target:1},
 {name:'Tauben', target:1},
 {name:'Trauben', target:2},
];

let binMovieBytes;
let step=0,placed=[],joined=[],dominoChecked=false,answer=-1,selected=null,bookReady=false,filmMuted=false;
function board(kind='image'){return '<div class="board-scroll"><div class="board">'+(kind==='image'?'<img src="'+media.image+'" alt="Winterliche Eiche am gefrorenen See, Kinder und Vögel">':'<video class="scene-film" playsinline preload="metadata" src="'+media[kind]+'"></video><div class="film-controls" aria-label="Filmsteuerung"><button id="filmToggle" aria-label="Film abspielen">Abspielen</button><button id="filmRestart" aria-label="Film von vorne abspielen">↻</button><input id="filmSeek" type="range" min="0" max="1000" value="0" aria-label="Wiedergabeposition"><span id="filmTime" class="film-time">0:00</span><button id="filmSound" aria-label="Ton ausschalten" aria-pressed="true">🔊</button></div>')+'</div></div>'}
function playVideo(){
 const v=screen.querySelector('video');if(!v)return;
 const toggle=$('filmToggle'),restart=$('filmRestart'),seek=$('filmSeek'),sound=$('filmSound'),time=$('filmTime');
 v.muted=filmMuted;v.volume=1;
 sound.hidden=false;
 const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
 const update=()=>{toggle.textContent=v.paused||v.ended?'Abspielen':'Pause';toggle.setAttribute('aria-label',v.paused||v.ended?'Film abspielen':'Film pausieren');const d=v.duration;seek.value=Number.isFinite(d)&&d>0?Math.round(v.currentTime/d*1000):0;time.textContent=fmt(v.currentTime)+(Number.isFinite(d)?' / '+fmt(d):'');sound.textContent=v.muted?'🔇':'🔊';sound.setAttribute('aria-label',v.muted?'Ton einschalten':'Ton ausschalten');sound.setAttribute('aria-pressed',String(!v.muted))};
 const start=()=>v.play().catch(()=>{if(!v.muted){v.muted=true;filmMuted=true;return v.play().catch(()=>{})}}).finally(update);
 toggle.onclick=()=>{if(v.paused||v.ended){if(v.ended)v.currentTime=0;start()}else v.pause()};
 restart.onclick=()=>{v.currentTime=0;start()};
 seek.oninput=()=>{if(Number.isFinite(v.duration)){v.currentTime=Number(seek.value)/1000*v.duration;update()}};
 seek.onchange=()=>{if(v.ended&&Number(seek.value)<1000)start()};
 sound.onclick=()=>{v.muted=!v.muted;filmMuted=v.muted;checkpoint();update()};
 ['loadedmetadata','timeupdate','play','pause','ended','volumechange','seeked'].forEach(e=>v.addEventListener(e,update));
 update();start()
}

function go(n){
 if(EichePageTurn.busy)return;
 if(n<0){location.assign('../abschnitt-2/');return}
 screen.querySelectorAll('video,audio').forEach(v=>v.pause());
 const target=Math.max(0,Math.min(8,n));
 EichePageTurn.run(()=>{step=target;bookReady=false;render();scrollTo(0,0)},target<step);
}
function render(){
 checkpoint();screen.className=step===0?'entry':step>=5?'wide':'';
 $('counter').textContent=(step+1)+' / 9';$('back').hidden=false;$('next').hidden=false;$('next').disabled=false;$('next').textContent='Weiter';
 if(step===0){screen.innerHTML='<h1>Winterschlaf</h1>'+board();$('next').textContent='Los geht’s';return}
 if(step===1||step===3){const first=step===1;screen.innerHTML='<h1>Winterschlaf</h1><div class="layout">'+board(first?'skate':'birds')+'<section class="read-column"><p class="paper">'+(first?a:b.replace(/^Sie /,"Die Eiche "))+'</p></section></div>';$('next').textContent=first?'Zur Aufgabe':'Zur Frage';playVideo();return}
 if(step===2){
 screen.innerHTML='<h1>Winterschlaf</h1><div class="layout">'+board()+'<section class="task"><h2>Lege den Satz in die richtige Reihenfolge.</h2><p class="domino-caption">Dein Satz – tippe einen gelegten Teil an, um ihn zurückzulegen.</p><div class="cards" id="slots"></div><p id="feedback" class="feedback" role="status"></p><p class="domino-caption">Satzteile</p><div class="cards" id="domino"></div><button class="action oak" id="checkDomino" hidden>Satz prüfen</button></section></div>';
 drawDomino();return}
 if(step===4){
 screen.innerHTML='<h1>Winterschlaf</h1><div class="layout">'+board()+'<section class="task"><h2>Wer streitet um die besten Plätze?</h2><div class="choices" id="choices"></div><p id="feedback" class="feedback" role="status"></p></section></div>';
 const choices=['Krähen und Trauben','Krähen und Tauben','Tauben und Kraken'];choices.forEach((t,i)=>{const x=document.createElement('button');x.className='answer';x.textContent=t;x.setAttribute('aria-pressed',String(answer===i));x.onclick=()=>{if(i===1){answer=i;render()}else showFeedback('Lies noch einmal!')};$('choices').append(x)});$('next').disabled=answer!==1;if(answer===1)showFeedback('Genau! Die Krähen und Tauben streiten.');return}
 if(step===5){
 screen.innerHTML='<h1>Wer ist wo?</h1><div class="layout">'+board()+'<section class="task matching"><h2>Ziehe jede Karte an den richtigen Platz. Ein Wort steht nicht im Lesetext.</h2><p>Du kannst auch erst die Karte und dann den Platz antippen.</p><div class="cards match-cards" id="pieces"></div><div class="placement" id="targets"></div><p id="feedback" class="feedback" role="status"></p></section></div>';drawMatch();return}
 if(step===6){screen.innerHTML='<h1>Winterschlaf</h1><div class="layout">'+board()+'<section class="read-column"><p class="paper"><strong>Merkt die Eiche etwas von dem Trubel?</strong><br>Was meinst du? Erzähle, was du denkst.</p><details class="read-again"><summary class="action oak">Zum Nachlesen</summary><article class="paper"><p>'+a+'</p><p>'+b+'</p></article></details></section></div>';$('next').textContent='Zum Vorlesen';return}
 if(step===7){screen.innerHTML='<h1>Winterschlaf</h1><div class="listen-content"><h2>Winterschlaf zum Anhören</h2><p class="listen-intro">Das hast du prima gemacht! Lehne dich zurück und höre der Geschichte zu.</p><audio id="narration" controls preload="metadata" src="'+media.audio+'"></audio><article class="paper original" style="white-space:pre-line">'+original+'</article></div>';return}
 screen.innerHTML='<h1>Und wie geht es jetzt weiter?</h1><div class="book-stage"><video playsinline id="bookClip" src="'+media.book+'"></video><img id="openStill" src="'+media.still+'" hidden alt="Würstchen mit geöffnetem Buch"><h2 class="book-title" id="bookTitle" hidden>Erste<br>warme<br>Sonnenstrahlen<img src="'+media.swirl+'" alt=""></h2></div><button class="jump" id="jump" hidden aria-label="Abschnitt abschließen"><video muted playsinline src="'+media.jump+'" poster="'+media.jumpStill+'"></video></button>';
 $('next').hidden=true;let v=$('bookClip');const done=()=>{if(step!==8)return;v.hidden=true;$('openStill').hidden=false;$('bookTitle').hidden=false;$('jump').hidden=false;$('jump').querySelector('video').play().catch(()=>{});bookReady=true};v.onended=done;v.onerror=done;v.play().catch(done);$('jump').onclick=()=>{if(bookReady){EicheProgress.complete(3);checkpoint();alert('Winterschlaf ist geschafft! Hier geht die Geschichte bald weiter.');location.assign('../')}};
}
function showFeedback(message) {
  $('feedback').textContent = message;
}

function drawDomino(){
 const full=joined.length===domino.length;
 dominoChecked=full&&joined.every((part,index)=>part===index);
 checkpoint();
 $('slots').replaceChildren(...domino.map((_,i)=>{const x=document.createElement('button');const filled=i<joined.length;x.className='slot'+(filled?' filled':'')+(dominoChecked?' verified':'');x.textContent=filled?domino[joined[i]]:'…';x.disabled=!filled;x.setAttribute('aria-label',filled?domino[joined[i]]+' zurücklegen':'Freier Satzplatz');x.onclick=()=>{joined.splice(i,1);dominoChecked=false;drawDomino()};return x}));
 $('domino').replaceChildren(...[2,0,1].map(i=>{const used=joined.includes(i),x=document.createElement('button');x.className='tile'+(used?' used':'');x.textContent=domino[i];x.disabled=used;x.setAttribute('aria-label',domino[i]+(used?', schon verwendet':''));x.onclick=()=>{if(!joined.includes(i)&&joined.length<domino.length){joined.push(i);dominoChecked=false;drawDomino()}};return x}));
 $('checkDomino').hidden=!full||dominoChecked;
 $('checkDomino').onclick=()=>{showFeedback('Lies deinen Satz noch einmal. Passt das so? Tippe auf die Satzteile, die du zurücklegen möchtest.')};
 $('next').disabled=!dominoChecked;
 showFeedback(dominoChecked?'Gut gemacht! Lies den ganzen Satz noch einmal.':full?'Lies deinen Satz noch einmal. Passt das so?':joined.length?'Tippe auf den nächsten Satzteil.':'');
}
function loadBinMovie() {
 if (!binMovieBytes) {
   binMovieBytes = fetch(binMovie).then(response => {
     if (!response.ok) throw new Error('Papierkorb nicht verfügbar');
     return response.blob();
   }).catch(() => {
     binMovieBytes = undefined;
     return null;
   });
 }
 return binMovieBytes;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const matchComplete = () => pieces.every((_, index) => placed.includes(index));
const matchBusy = () => $('targets').querySelector('[aria-busy="true"]') !== null;

function selectPiece(index) {
 if (matchBusy()) return;
 selected = index;
 $('pieces').querySelectorAll('button').forEach(card => {
   const active = Number(card.dataset.piece) === index;
   card.classList.toggle('selected', active);
   card.setAttribute('aria-pressed', String(active));
 });
}

async function playBin(target, index, accepted) {
 if (reduceMotion.matches) return;
 target.setAttribute('aria-busy', 'true');
 $('next').disabled = true;
 const bytes = await loadBinMovie();
 if (!target.isConnected) return;
 if (bytes) {
   const image = target.querySelector('img');
   const art = image.parentElement;
   const url = URL.createObjectURL(bytes);
   const word = document.createElement('span');
   word.className = 'bin-word ' + (accepted ? 'accept' : 'reject');
   word.textContent = pieces[index].name;
   word.setAttribute('aria-hidden', 'true');
   if (!accepted) {
     const card = $('piece' + index);
     card.classList.add('spat-card');
     art.classList.add('shake');
     // The original card reappears at the end of the spit.
     setTimeout(() => card.classList.remove('spat-card'), 1880);
   }
   art.append(word);
   image.src = url;
   await new Promise(resolve => setTimeout(resolve, 3000));
   image.src = binStill;
   URL.revokeObjectURL(url);
   word.remove();
   art.classList.remove('shake');
 }
 target.removeAttribute('aria-busy');
 if (target.isConnected) $('next').disabled = !matchComplete();
}

async function assign(index, targetIndex) {
 if (matchBusy() || placed.includes(index)) return;
 const piece = pieces[index];
 const correct = piece.target === targetIndex;
 const usedKeyboard = document.activeElement?.matches('#targets button, #pieces button');
 selected = null;
 if (correct) placed.push(index);
 drawMatch();

 if (targetIndex === 2) {
   const hint = piece.target === 1
     ? 'Schau noch einmal nach: Wer streitet oben in den Ästen?'
     : 'Schau noch einmal nach: Wer läuft auf dem Eis Schlittschuh?';
   const message = correct ? 'Erwischt! Die Trauben haben sich dazugemogelt.' : hint;
   showFeedback(message);
   const target = $('targets').querySelector('[data-target="2"]');
   await playBin(target, index, correct);
   if (!target.isConnected) return;
   if (correct && matchComplete()) showFeedback(message + ' Alles richtig!');
 } else if (correct) {
   showFeedback(matchComplete() ? 'Alles richtig!' : 'Sehr gut!');
 } else {
   showFeedback('Huch! Dieser Platz passt noch nicht. Versuche es noch einmal.');
   if (!reduceMotion.matches) {
     $('piece' + index).animate({transform:['translateX(0)','translateX(10px)','translateX(0)']}, {duration:280});
   }
 }

 if (usedKeyboard) {
   const focusTarget = correct ? $('pieces').querySelector('button:not([hidden])') || $('next') : $('piece' + index);
   focusTarget?.focus({preventScroll:true});
 }
}

function makePiece(index) {
 const card = document.createElement('button');
 card.id = 'piece' + index;
 card.dataset.piece = index;
 card.className = 'tile drag-card';
 card.textContent = pieces[index].name;
 card.disabled = placed.includes(index);
 card.hidden = card.disabled;
 card.setAttribute('aria-pressed', 'false');
 card.onclick = event => { if (event.detail === 0) selectPiece(index); };

 card.onpointerdown = event => {
   if (card.disabled || event.button !== 0 || matchBusy()) return;
   const {clientX:startX, clientY:startY, pointerId} = event;
   let ghost, scrollFrame, pointerY;
   card.setPointerCapture(pointerId);
   const scrollAtEdge = () => {
     const margin = Math.min(68, innerHeight / 5);
     const proximity = pointerY < margin ? pointerY - margin : Math.max(0, pointerY - innerHeight + margin);
     if (proximity) window.scrollBy(0, proximity / 4);
     scrollFrame = requestAnimationFrame(scrollAtEdge);
   };
   const cleanUp = () => {
     ghost?.remove();
     cancelAnimationFrame(scrollFrame);
     card.onpointermove = card.onpointerup = card.onpointercancel = card.onlostpointercapture = null;
   };
   card.onpointermove = move => {
     if (move.pointerId !== pointerId) return;
     pointerY = move.clientY;
     if (!ghost && Math.hypot(move.clientX - startX, move.clientY - startY) > 7) {
       ghost = card.cloneNode(true);
       ghost.removeAttribute('id');
       ghost.classList.add('drag-ghost');
       document.body.append(ghost);
       scrollFrame = requestAnimationFrame(scrollAtEdge);
     }
     if (ghost) {
       ghost.style.left = move.clientX + 'px';
       ghost.style.top = move.clientY + 'px';
     }
   };
   card.onpointerup = release => {
     if (release.pointerId !== pointerId) return;
     const dragged = Boolean(ghost);
     cleanUp();
     if (dragged) {
       const target = document.elementFromPoint(release.clientX, release.clientY)?.closest('#targets [data-target]');
       if (target) assign(index, Number(target.dataset.target));
       else selectPiece(null);
     } else {
       selectPiece(index);
     }
   };
   card.onpointercancel = card.onlostpointercapture = cleanUp;
 };
 return card;
}

function drawMatch() {
 checkpoint();
 if (!reduceMotion.matches) loadBinMovie();
 $('pieces').replaceChildren(...[2,3,0,1].map(makePiece));
 $('targets').replaceChildren(...matchTargets.map((name, targetIndex) => {
   const target = document.createElement('button');
   target.className = 'target';
   target.dataset.target = targetIndex;
   const label = document.createElement('span');
   label.className = 'target-label';
   label.textContent = name;
   if (targetIndex === 2) {
     target.classList.add('target-bin');
     const art = document.createElement('span');
     art.className = 'bin-art';
     const image = new Image();
     image.src = binStill;
     image.alt = '';
     art.append(image);
     target.append(art, label);
   } else {
     const list = document.createElement('span');
     list.className = 'target-results';
     list.textContent = placed.filter(i => pieces[i].target === targetIndex).map(i => pieces[i].name + ' ✓').join(' · ');
     target.append(label, list);
   }
   target.onclick = () => { if (selected !== null) assign(selected, targetIndex); };
   return target;
 }));
 $('next').disabled = !matchComplete();
 if (matchComplete()) showFeedback('Alles richtig!');
}
 $('back').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('restart').onclick=()=>{joined=[];dominoChecked=false;placed=[];answer=-1;selected=null;go(0);document.querySelector('details').open=false};
 $('settingsButton').onclick=()=>{$('settings').hidden=!$('settings').hidden;$('settingsButton').setAttribute('aria-expanded',String(!$('settings').hidden))};
 for(const [id,prop,percent] of [['letters','--letters',false],['boardSize','--board',true]]){$(id).oninput=()=>{document.documentElement.style.setProperty(prop,percent?$(id).value+'%':$(id).value/100);$(id).nextElementSibling.value=$(id).value+' %'}}
 $('infoButton').onclick=()=>$('info').showModal();$('closeInfo').onclick=()=>$('info').close();
 const saved=EicheProgress.readForVisit(3);if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=8){step=saved.step;placed=Array.isArray(saved.placed)?[...new Set(saved.placed.filter(i=>Number.isInteger(i)&&pieces[i]))]:[];joined=Array.isArray(saved.joined)?saved.joined:[];dominoChecked=Boolean(saved.dominoChecked);answer=saved.answer===1?1:-1;filmMuted=Boolean(saved.filmMuted)}
 render();
</script></body></html>
