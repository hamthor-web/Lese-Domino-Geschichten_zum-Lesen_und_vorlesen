<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0e5f7"><meta name="description" content="Die Geschichte von Silvana beginnt. Höre zu, lies selbst und lege deinen ersten Domino-Satz.">
<title>Silvana · Die Geschichte beginnt</title>
<link rel="stylesheet" href="styles.css?v=6">
<script src="game.js?v=15" defer></script>
<style>
.scene-menu{position:relative;display:inline-block;margin:4px 0 18px;max-width:100%}
.scene-menu summary{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:9px 18px;background:#f5edf8;border:2px solid #c8b4d9;border-radius:14px;font-weight:bold;font-size:calc(19px * var(--text));cursor:pointer;list-style:none}
.scene-menu summary::-webkit-details-marker{display:none}
.scene-menu summary:after{content:'▾';font-size:18px}.scene-menu[open] summary:after{content:'▴'}
.scene-menu summary:focus-visible,.scene-menu a:focus-visible{outline:4px solid #8a649f;outline-offset:3px}
.scene-menu nav{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:min(390px,calc(100vw - 40px));padding:8px;background:#fffdf9;border:2px solid #dbc8e9;border-radius:16px;box-shadow:0 10px 26px #55416030}
.scene-menu a{display:block;padding:13px 14px;min-height:52px;border-radius:10px;color:#493e58;text-decoration:none;font-size:calc(19px * var(--text));overflow-wrap:break-word}
.scene-menu a:hover,.scene-menu a[aria-current="page"]{background:#efe3f7;font-weight:bold}
.scene-menu [hidden],.scene-backbar[hidden]{display:none!important}
.scene-backbar{display:flex;margin:4px 0 18px}.scene-backbar button{max-width:100%}

.adventure-link{flex-basis:100%;min-width:0}
.adventure-link p,.adventure-next{font-size:calc(22px * var(--text));font-weight:bold;line-height:1.5;margin:12px 0;text-align:center}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#main"><span class="brandmark" aria-hidden="true">✧</span><span>Silvana<span class="brand-sub">Geschichten zum Lesen und Vorlesen</span></span></a><button class="quiet" id="settingsToggle" aria-expanded="false" aria-controls="settings">Aa · Größe ändern</button></header>
<section id="settings" class="settings" aria-label="Größe einstellen" hidden>
<label for="textSize">Schrift <output id="textOutput" for="textSize">100 %</output><input id="textSize" type="range" min="90" max="160" step="10" value="100"></label>
<label for="boardSize">Spielfeld <output id="boardOutput" for="boardSize">100 %</output><input id="boardSize" type="range" min="80" max="160" step="10" value="100"></label>
<p>Stelle Schrift und Spielfeld unabhängig voneinander ein.</p>
</section>
<main id="main" tabindex="-1">
<details class="scene-menu" id="sceneMenu"><summary>Noch einmal lesen:</summary><nav aria-label="Bereits besuchte Abschnitte"><a href="./" aria-current="page">Die Geschichte beginnt</a><a href="../szene-2/" id="sceneMenu2" hidden>Die vier Straßen</a></nav></details>
<div class="chapterline"><span class="chapter">Die Geschichte beginnt</span><span class="chapter-count">Einführung · Abschnitt 1</span></div>
<nav class="steps" aria-label="Dein Weg durch die Einführung"><button id="step0" class="step active" aria-current="step"><span class="step-number">1</span> Zuhören</button><button id="step1" class="step" disabled><span class="step-number">2</span> Selbst lesen</button><button id="step2" class="step" disabled><span class="step-number">3</span> Domino legen</button></nav>

<div id="game"></div>
<noscript>Bitte aktiviere JavaScript, um das Domino zu spielen.</noscript>
<footer><span>In deinem Tempo. Ohne Zeitdruck.</span><span class="footerleaf" aria-hidden="true">✧</span><span>Das Land der glitzernden Spinnweben</span></footer>
</main>
<template id="landscape"><img class="landscape" src="assets/silvana-karte.png" width="1536" height="1024" alt="Silvana: zwei Dörfer, eine Stadt und eine Burg zwischen Bergen und einem Wald mit glitzernden Spinnweben."></template>
</body></html>
