<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0e5f7"><meta name="description" content="Die Geschichte von Silvana beginnt. Höre zu, lies selbst und lege deinen ersten Domino-Satz.">
<title>Silvana · Die Geschichte beginnt</title>
<link rel="stylesheet" href="styles.css?v=5">
<script src="game.js?v=7" defer></script>
<style>
.scene-menu{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 18px;align-items:center}.scene-menu button{flex:1 1 220px;max-width:100%;min-width:0}.scene-backbar{display:flex;margin:4px 0 18px}.scene-backbar button{max-width:100%}.scene-menu button[aria-current="page"]{outline:3px solid #b9a4cb;outline-offset:2px}.scene-menu [hidden],.scene-backbar[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#main"><span class="brandmark" aria-hidden="true">✧</span><span>Silvana<span class="brand-sub">Geschichten zum Lesen und Vorlesen</span></span></a><button class="quiet" id="settingsToggle" aria-expanded="false" aria-controls="settings">Aa · Größe ändern</button></header>
<section id="settings" class="settings" aria-label="Größe einstellen" hidden>
<label for="textSize">Schrift <output id="textOutput" for="textSize">100 %</output><input id="textSize" type="range" min="90" max="160" step="10" value="100"></label>
<label for="boardSize">Spielfeld <output id="boardOutput" for="boardSize">100 %</output><input id="boardSize" type="range" min="80" max="160" step="10" value="100"></label>
<p>Stelle Schrift und Spielfeld unabhängig voneinander ein.</p>
</section>
<main id="main" tabindex="-1">
<nav class="scene-menu" aria-label="Bereits besuchte Szenen"><button class="secondary" id="sceneMenu1" aria-current="page">Szene 1</button><button class="secondary" id="sceneMenu2" hidden>Szene 2</button></nav>
<div class="chapterline"><span class="chapter">Die Geschichte beginnt</span><span class="chapter-count">Einführung · Abschnitt 1</span></div>
<nav class="steps" aria-label="Dein Weg durch die Einführung"><button id="step0" class="step active" aria-current="step"><span class="step-number">1</span> Zuhören</button><button id="step1" class="step" disabled><span class="step-number">2</span> Selbst lesen</button><button id="step2" class="step" disabled><span class="step-number">3</span> Domino legen</button></nav>
<div class="scene-backbar" id="sceneBackbar" hidden><button class="secondary" id="sceneBack">← Zurück</button></div>
<div id="game"></div>
<noscript>Bitte aktiviere JavaScript, um das Domino zu spielen.</noscript>
<footer><span>In deinem Tempo. Ohne Zeitdruck.</span><span class="footerleaf" aria-hidden="true">✧</span><span>Das Land der glitzernden Spinnweben</span></footer>
</main>
<template id="landscape"><img class="landscape" src="assets/silvana-karte.png" width="1536" height="1024" alt="Silvana: zwei Dörfer, eine Stadt und eine Burg zwischen Bergen und einem Wald mit glitzernden Spinnweben."></template>
</body></html>
