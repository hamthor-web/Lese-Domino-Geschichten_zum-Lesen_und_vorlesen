<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silvana – Szene 2: Vorstellung</title>
<link rel="stylesheet" href="../vorschau-einfuehrung/styles.css?v=5">
<style>
.s2{max-width:1200px;margin:auto}.stage{background:#fffdf9;border:2px solid #e4d4ec;border-radius:22px;padding:clamp(18px,3vw,36px);margin-bottom:24px}.s2 .text{font-size:calc(24px * var(--text));line-height:1.75;white-space:pre-line}.s2 .original{font-size:calc(21px * var(--text));line-height:1.7;white-space:pre-line}.controls{display:flex;gap:15px;flex-wrap:wrap;margin:24px 0}.controls>button{flex:1 1 270px}.crate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:25px 0}.crate{border:6px solid #b99573!important;border-radius:22px!important;background:linear-gradient(#f8e9cf,#d6b68b)!important;color:#43364b!important;box-shadow:0 8px 0 #b5a19b!important;min-height:170px!important;font-size:calc(26px * var(--text));font-weight:bold;padding:24px;cursor:pointer}.crate:focus-visible,.image-choice:focus-visible{outline:5px solid #946bb5}.crate.correct{background:#e2f3e7!important;border-color:#76a58a!important}.photos{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:25px 0}.image-choice{background:#fff8f0;border:4px solid #cbb6df;border-radius:22px;padding:14px;font:inherit;font-size:calc(23px * var(--text));font-weight:bold;color:#493e58;cursor:pointer;min-width:0}.image-choice svg{display:block;width:100%;height:auto;border-radius:13px}.image-choice.correct{border-color:#65a482;background:#e8f6ee}.feedback{min-height:52px;font-size:calc(22px * var(--text));font-weight:bold;color:#584766}.crumbs{margin:10px 0 20px;color:#6f5a78}.s2 button.primary,.s2 button.secondary{font-size:calc(20px * var(--text));min-height:80px}.s2 button:disabled{cursor:default}.s2 h1{overflow-wrap:normal}@media(max-width:760px){.crate-grid,.photos{grid-template-columns:1fr}.crate{min-height:116px!important}.controls{flex-direction:column}.controls>button{flex:auto}}
.scene-menu{position:relative;display:inline-block;margin:4px 0 18px;max-width:100%}
.scene-menu summary{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:9px 18px;background:#f5edf8;border:2px solid #c8b4d9;border-radius:14px;font-weight:bold;font-size:calc(19px * var(--text));cursor:pointer;list-style:none}
.scene-menu summary::-webkit-details-marker{display:none}
.scene-menu summary:after{content:'▾';font-size:18px}.scene-menu[open] summary:after{content:'▴'}
.scene-menu summary:focus-visible,.scene-menu a:focus-visible{outline:4px solid #8a649f;outline-offset:3px}
.scene-menu nav{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:min(390px,calc(100vw - 40px));padding:8px;background:#fffdf9;border:2px solid #dbc8e9;border-radius:16px;box-shadow:0 10px 26px #55416030}
.scene-menu a{display:block;padding:13px 14px;min-height:52px;border-radius:10px;color:#493e58;text-decoration:none;font-size:calc(19px * var(--text));overflow-wrap:break-word}
.scene-menu a:hover,.scene-menu a[aria-current="page"]{background:#efe3f7;font-weight:bold}
.scene-backbar{display:flex;margin:4px 0 18px}.scene-backbar button{max-width:100%}.scene-backbar[hidden]{display:none!important}
</style></head>
<body><header class="topbar"><a class="brand" href="../vorschau-einfuehrung/"><span class="brandmark">✧</span><span>Silvana<span class="brand-sub">Geschichten zum Lesen und Vorlesen</span></span></a><button class="quiet" id="settingsToggle" aria-expanded="false" aria-controls="settings">Aa · Größe ändern</button></header>
<section id="settings" class="settings" hidden><label for="textSize">Schrift <output id="textOutput">100 %</output><input id="textSize" type="range" min="90" max="160" step="10" value="100"></label><label for="boardSize">Spielfeld <output id="boardOutput">100 %</output><input id="boardSize" type="range" min="80" max="160" step="10" value="100"></label><p>Stelle Schrift und Spielfeld unabhängig voneinander ein.</p></section>
<main class="s2" id="main"><details class="scene-menu" id="sceneMenu"><summary>☰ Menü</summary><nav aria-label="Bereits besuchte Abschnitte"><a href="../vorschau-einfuehrung/?abschnitt=abschluss">Die Geschichte beginnt</a><a href="./" aria-current="page">Die vier Straßen</a></nav></details><div class="chapterline"><span class="chapter">Die vier Straßen</span><span class="chapter-count">Szene 2 · Vorstellung</span></div><div class="crumbs" id="crumbs"></div><div class="scene-backbar"><button class="secondary" id="sceneBack">← Zurück</button></div><div id="game"></div><footer><span>In deinem Tempo. Ohne Zeitdruck.</span><span>Silvana</span></footer></main>
<script>
'use strict';
const original="Vier Straßen voller Schlaglöcher hatte Silvana, und wenn die Kutschen darüber holperten, wurden die Einheimischen aus ihrem ohnehin viel zu leichten Schlaf geweckt. Zum Glück kamen nicht allzu viele vorbei.\nWenn es regnete, roch es auf dem Marktplatz nach nasser Wolle, Pferdemist und dem alten Fett aus der Bäckerei. Und ein bisschen nach alten Gewohnheiten, die sich schon viel zu lange in den Ritzen der Stadt eingenistet hatten.\nViel hatte das Land nicht zu bieten. Reich war Silvana trotzdem.";
const simple="In Silvana gab es nur vier Straßen mit vielen Löchern. Wenn Kutschen darüber holperten, wachten die Leute auf.\nWenn es regnete, roch der Marktplatz nach nasser Wolle, Pferdemist und Bäckerei.\nSilvana hatte nicht viel, aber das Land war trotzdem reich.";
const $=id=>document.getElementById(id);const VISITED_KEY='silvana-visited-scenes-v1';try{localStorage.setItem(VISITED_KEY,'2')}catch{}let phase=0,audioState='idle',voice=null,boxDone=false,pictureDone=false,mistakes=0;
function sizes(){document.documentElement.style.setProperty('--text',Number($('textSize').value)/100);document.documentElement.style.setProperty('--board',Number($('boardSize').value)/100);$('textOutput').textContent=$('textSize').value+' %';$('boardOutput').textContent=$('boardSize').value+' %';}
$('settingsToggle').onclick=()=>{let isOpen=$('settings').hidden;$('settings').hidden=!isOpen;$('settingsToggle').setAttribute('aria-expanded',String(isOpen));};['textSize','boardSize'].forEach(id=>$(id).addEventListener('input',sizes));sizes();
function stop(){if('speechSynthesis' in window)speechSynthesis.cancel();audioState='idle';voice=null}
function speak(){if(!('speechSynthesis' in window)){notice('Die Vorlesestimme ist in diesem Browser nicht verfügbar.');return}if(audioState==='playing'){speechSynthesis.pause();audioState='paused';$('audio').textContent='▶ Weiterhören';return}if(audioState==='paused'){speechSynthesis.resume();audioState='playing';$('audio').textContent='Ⅱ Pause';return}stop();voice=new SpeechSynthesisUtterance(original);voice.lang='de-DE';voice.rate=.85;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('de'));if(v)voice.voice=v;voice.onend=()=>{audioState='ended';if($('audio'))$('audio').textContent='↻ Noch einmal hören'};speechSynthesis.speak(voice);audioState='playing';$('audio').textContent='Ⅱ Pause'}
function go(n){stop();phase=n;render();scrollTo(0,0)}
function notice(x){if($('feedback'))$('feedback').textContent=x}
function city(rain){let drops='';if(rain){for(let i=0;i<24;i++){let x=25+i*23,y=75+(i*47)%125;drops+='<path d="M'+x+' '+y+'l-7 14" stroke="#407b9b" stroke-width="4"/>'}}return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Stadt '+(rain?'bei Regen':'bei Sonnenschein')+'"><rect width="600" height="400" fill="'+(rain?'#bdcddd':'#a8ddf6')+'"/>'+(rain?'<g fill="#8fa3b4"><ellipse cx="140" cy="70" rx="125" ry="45"/><ellipse cx="350" cy="61" rx="155" ry="46"/><ellipse cx="520" cy="90" rx="110" ry="42"/></g>':'<circle cx="510" cy="74" r="48" fill="#ffdf78"/><g fill="#fff"><ellipse cx="155" cy="74" rx="95" ry="26"/></g>')+'<path d="M0 280Q180 240 320 280T600 280V400H0" fill="'+(rain?'#9faea3':'#bad68c')+'"/><g stroke="#877384" stroke-width="4"><path d="M32 325V180h142v145Z" fill="#f1d6b4"/><path d="m20 182 81-80 87 80Z" fill="#ad8298"/><path d="M196 325V163h142v162Z" fill="#edd0b8"/><path d="m183 164 84-82 84 82Z" fill="#9c8cad"/><path d="M364 326V185h124v141Z" fill="#f0dfbf"/><path d="m350 186 76-73 76 73Z" fill="#ba8981"/><path d="M502 329V215h89v114Z" fill="#e0c0a4"/><path d="m492 215 55-62 54 62Z" fill="#a88aa9"/></g><g fill="#a6d5e2" stroke="#776d83" stroke-width="4"><rect x="58" y="208" width="38" height="45"/><rect x="119" y="208" width="35" height="45"/><rect x="226" y="195" width="37" height="44"/><rect x="279" y="195" width="38" height="44"/><rect x="392" y="216" width="31" height="42"/><rect x="447" y="216" width="31" height="42"/><rect x="527" y="240" width="33" height="37"/></g><g fill="#84677a"><rect x="90" y="270" width="38" height="55"/><rect x="249" y="256" width="39" height="69"/><rect x="411" y="277" width="38" height="49"/><rect x="531" y="285" width="34" height="44"/></g><path d="M0 353H600V400H0Z" fill="'+(rain?'#8999ab':'#b7a99a')+'"/><path d="M0 364Q160 326 300 360T600 357" stroke="#eee5d2" stroke-width="10" fill="none"/>'+drops+'</svg>'}
function panel(inner){return '<section class="stage">'+inner+'</section>'}
$('sceneBack').onclick=()=>{if(phase===0)location.href='../vorschau-einfuehrung/?abschnitt=abschluss';else go(phase-1)};
function render(){const labels=['Zuhören','Selbst lesen','Kiste öffnen','Bild wählen','Geschafft'];$('crumbs').textContent='Schritt '+(phase+1)+' von 5 · '+labels[phase];let out='';
if(phase===0)out=panel('<span class="eyebrow">Die Geschichte geht weiter</span><h1>Silvana und die vier Straßen</h1><p>Höre die Geschichte an.</p><div class="controls"><button class="primary" id="audio">▶ Geschichte anhören</button><button class="secondary" id="repeat">↻ Von vorn hören</button></div><p class="feedback" id="feedback" aria-live="polite"></p><details><summary>Originaltext zum Mitlesen</summary><p class="original">'+original+'</p></details><div class="controls"><button class="primary" id="next">Weiter</button></div>');
else if(phase===1)out=panel('<span class="eyebrow">Jetzt bist du dran</span><h1>Die vier Straßen</h1><p>Lies in deinem Tempo.</p><div class="text">'+simple+'</div><div class="controls"><button class="secondary" id="back">← Zurück</button><button class="primary" id="next">Weiter</button></div>');
else if(phase===2)out=panel('<span class="eyebrow">Welches Wort kommt im Text vor?</span><h1>Öffne die richtige Kiste!</h1><p>Tippe auf das Wort, das du im Lesetext gefunden hast.</p><details><summary>Lesetext ansehen</summary><p class="text">'+simple+'</p></details><div class="crate-grid"><button class="crate" data-answer="Marktplatz">Marktplatz</button><button class="crate" data-answer="Stoff">Stoff</button><button class="crate" data-answer="Wege">Wege</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="controls"><button class="secondary" id="back">← Zurück</button></div>');
else if(phase===3)out=panel('<span class="eyebrow">In der richtigen Kiste</span><h1>Welches Bild passt zum Text?</h1><p>Welches Wetter wird im Text beschrieben? Tippe auf das passende Bild.</p><div class="photos"><button class="image-choice" data-answer="sun">'+city(false)+'<span>Stadt im Sonnenschein</span></button><button class="image-choice" data-answer="rain">'+city(true)+'<span>Stadt im Regen</span></button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="controls"><button class="secondary" id="back">← Zurück</button><button class="primary" id="next" '+(pictureDone?'':'disabled')+'>Weiter</button></div>');
else out=panel('<span class="eyebrow">Szene 2 geschafft</span><h1>Sehr gut hingeschaut!</h1><p>Du hast das Wort „Marktplatz“ gefunden und das richtige Wetter erkannt.</p><p>Silvana hatte nicht viel – und war trotzdem reich.</p><div class="controls"><button class="secondary" id="again">Diese Szene wiederholen</button><button class="primary" id="intro">Zur Einführung</button></div>');
$('game').innerHTML=out;
if(phase===0){$('audio').onclick=speak;$('repeat').onclick=()=>{stop();speak()};$('next').onclick=()=>go(1)}
if(phase===1){$('back').onclick=()=>go(0);$('next').onclick=()=>go(2)}
if(phase===2){$('back').onclick=()=>go(1);document.querySelectorAll('.crate').forEach(b=>b.onclick=()=>{if(b.dataset.answer==='Marktplatz'){b.classList.add('correct');document.querySelectorAll('.crate').forEach(x=>x.disabled=true);notice('Richtig! Das Wort „Marktplatz“ steht im Text. Die Kiste öffnet sich.');setTimeout(()=>go(3),900)}else{mistakes++;notice(mistakes===1?'Schau noch einmal in den Lesetext.':'Denk an den Satz: „Wenn es regnete, roch der …“')}})}
if(phase===3){$('back').onclick=()=>go(2);$('next').onclick=()=>go(4);document.querySelectorAll('.image-choice').forEach(b=>b.onclick=()=>{if(b.dataset.answer==='rain'){b.classList.add('correct');document.querySelectorAll('.image-choice').forEach(x=>x.disabled=true);pictureDone=true;$('next').disabled=false;notice('Richtig! Im Text steht, dass es regnete.')}else notice('Im Text steht ein Hinweis zum Wetter. Lies ihn noch einmal.')})}
if(phase===4){$('again').onclick=()=>{mistakes=0;pictureDone=false;go(0)};$('intro').onclick=()=>location.href='../vorschau-einfuehrung/'}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audioState==='playing'&&'speechSynthesis' in window){speechSynthesis.pause();audioState='paused';if($('audio'))$('audio').textContent='▶ Weiterhören'}});window.addEventListener('pagehide',stop);render();
</script></body></html>
