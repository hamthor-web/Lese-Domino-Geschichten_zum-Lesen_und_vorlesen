<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Eiche – Navigationstest</title><style>body{font:22px system-ui;background:#f4e9d4;color:#503922;margin:0;min-height:100dvh;display:grid;place-items:center}main{width:min(90%,650px);text-align:center}a,button{display:block;box-sizing:border-box;width:100%;margin:16px 0;padding:17px;border:2px solid #795335;border-radius:14px;background:#fff9ed;color:inherit;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.4}p{line-height:1.5}</style><main><h1>Die Eiche</h1><p>Testversion – Weiter-Navigation<br>Eigener Spielstand, unabhängig von der regulären App.</p><a href="./abschnitt-1/?neu=1">Spiel neu starten</a><button id="resume">Spiel fortsetzen</button><button id="reset">Testspiel zurücksetzen</button><p>Spiele einmal bis zum Ende von Winterschlaf und starte danach erneut, ohne zurückzusetzen.</p></main><script src="spielstand.js"></script><script>const resume=document.getElementById('resume');function refresh(){resume.disabled=EicheProgress.latest()===null}resume.onclick=()=>{const s=EicheProgress.latest();if(s!==null)location.assign('./abschnitt-'+s+'/')};document.getElementById('reset').onclick=()=>{if(confirm('Nur den Testspielstand löschen?')){EicheProgress.reset();refresh()}};refresh();addEventListener('pageshow',refresh);</script></html>
