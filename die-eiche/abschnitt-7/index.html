<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die Eiche · Sommer</title>
  <link rel="stylesheet" href="../abschnitt-4/abschnitt.css?v=2">
  <link rel="stylesheet" href="../../shared/game-selection.css">
  <link rel="stylesheet" href="sommer.css?v=2">
  <script src="../spielstand.js?v=7" defer></script>
  <script src="../../shared/story-speech.js" defer></script>
  <script src="kreuzwortraetsel.js?v=2" defer></script>
</head>
<body class="summer-page">
  <main class="summer">
    <header class="topbar">
      <div class="brand"><strong>Die Eiche</strong>Geschichten zum Lesen und Vorlesen</div>
      <a class="game-selection-link" href="../../">Zur Spielauswahl</a>
    </header>
    <details class="scene-menu">
      <summary class="game-button"><span>Anderen Abschnitt<br>noch einmal erleben</span></summary>
      <div class="scene-choices">
        <a class="game-button" href="../abschnitt-1/?neu=1">Die Eiche</a>
        <a class="game-button" href="../abschnitt-2/?neu=1">Spuren der Zeit</a>
        <a class="game-button" href="../abschnitt-3/?neu=1">Winterschlaf</a>
        <a class="game-button" href="../abschnitt-4/?neu=1">Erste warme Sonnenstrahlen</a>
        <a class="game-button" href="../abschnitt-5/?neu=1">Der Frühling beginnt</a>
        <a class="game-button" href="../abschnitt-6/?neu=1">Die Freude der Eiche</a>
        <a class="game-button" href="?neu=1">Sommer</a>
      </div>
    </details>

    <section class="summer-scene" aria-labelledby="summer-title">
      <div class="summer-art" aria-hidden="true"></div>
      <div class="summer-content">
        <h1 id="summer-title">Sommer in der Eiche</h1>
        <section id="crossword" aria-labelledby="crossword-title">
          <h2 id="crossword-title">Kreuzworträtsel</h2>
          <div class="crossword-progress">
            <progress id="progress" max="7" value="0" aria-label="Gefundene Wörter"></progress>
            <span id="count"></span>
          </div>
          <div class="crossword-layout">
            <div class="clue-panel">
              <div class="current-clue">
                <p id="question"></p>
                <button class="summer-action" id="read" type="button">Frage vorlesen</button>
              </div>
              <div id="clues" role="group" aria-label="Fragen"></div>
            </div>
            <div class="board-panel">
              <div id="grid" role="group" aria-label="Buchstabenfelder"></div>
              <p id="feedback" role="status"></p>
            </div>
          </div>
        </section>
      </div>
    </section>

    <nav class="summer-nav" aria-label="Abschnittsseiten">
      <a class="game-button" href="../abschnitt-6/">Zurück zu Die Freude der Eiche</a>
      <button class="game-button" id="replay" type="button" hidden>Abschnitt noch einmal</button>
    </nav>
  </main>
</body>
</html>
